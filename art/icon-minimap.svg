<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 60 440 440" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23527a"/>
      <stop offset="1" stop-color="#0c1c2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#4f8fc0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4f8fc0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="1" stop-color="#e2bd6b"/>
    </linearGradient>
    <radialGradient id="pinHead" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="0.45" stop-color="#e02b20"/>
      <stop offset="1" stop-color="#7a0d08"/>
    </radialGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d949c"/>
      <stop offset="0.5" stop-color="#f2f4f6"/>
      <stop offset="1" stop-color="#6b7178"/>
    </linearGradient>
  </defs>

  <!-- speech bubble -->
  <g transform="translate(-6 40) scale(0.92)">
  <path d="M130 150 h232 a58 58 0 0 1 58 58 v118 a58 58 0 0 1 -58 58 h-150 l-86 70 l18 -70 h-14 a58 58 0 0 1 -58 -58 v-118 a58 58 0 0 1 58 -58 z"
        fill="url(#paper)" stroke="#3b2a12" stroke-width="16" stroke-linejoin="round"/>

  <!-- slash: it's a slash command -->
  <path d="M270 200 L196 340" stroke="#3b2a12" stroke-width="34" stroke-linecap="round"/>
  </g>

  <!-- pushpin stuck in the top-right corner of the bubble -->
  <ellipse cx="318" cy="237" rx="14" ry="8" fill="#3b2a12" opacity="0.55"/>
  <g transform="translate(318 235) rotate(35)">
    <path d="M-8 -60 L0 0 L8 -60 z" fill="url(#needle)" stroke="#2a2d31" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-32" y="-86" width="64" height="24" rx="10" fill="#b01e16" stroke="#3a0604" stroke-width="7"/>
    <path d="M-19 -86 L-27 -144 L27 -144 L19 -86 z" fill="#c9241b" stroke="#3a0604" stroke-width="7" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-158" rx="56" ry="26" fill="url(#pinHead)" stroke="#3a0604" stroke-width="7"/>
  </g>
</svg>
